name: release

# Push a tag like v0.2.0 and this attaches a ready-to-play zip to a GitHub
# release, so people can play without Node or uv.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: build
        working-directory: game
        run: |
          npm ci --ignore-scripts
          npm run py
          npm run build
      - name: zip
        run: |
          mv game/dist headcrawl
          cp scripts/play.py headcrawl/play.py
          zip -qr "headcrawl-${GITHUB_REF_NAME}.zip" headcrawl
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "headcrawl-${GITHUB_REF_NAME}.zip" --generate-notes
