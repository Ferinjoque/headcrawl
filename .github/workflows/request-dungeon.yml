# Turn an issue titled "dungeon: owner/repo" into a gallery dungeon.
#
# Runs only when someone with triage rights adds the "dungeon" label, so
# strangers can't make the repo clone whatever they like. The analyze job has
# no write access at all. The publish job never runs code from the analyzed
# repo, it only validates the JSON the first job produced and commits it.

name: request-dungeon

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: request-dungeon
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event.label.name == 'dungeon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      target: ${{ steps.parse.outputs.target }}
      slug: ${{ steps.parse.outputs.slug }}
    steps:
      - id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          re='^[Dd]ungeon:[[:space:]]*([A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100})[[:space:]]*$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "Title must look like: dungeon: owner/repo" >&2
            exit 1
          fi
          target="${BASH_REMATCH[1]}"
          slug="gh-$(echo "$target" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | cut -c1-57)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - working-directory: analyzer
        run: |
          uv sync --locked
          uv run headcrawl prefetch
      - working-directory: analyzer
        env:
          TARGET: ${{ steps.parse.outputs.target }}
        run: uv run headcrawl analyze "$TARGET" --compact -o "$RUNNER_TEMP/dungeon.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dungeon
          path: ${{ runner.temp }}/dungeon.json
          retention-days: 1

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dungeon
          path: ${{ runner.temp }}/in
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - working-directory: analyzer
        run: |
          uv sync --locked
          uv run headcrawl validate "$RUNNER_TEMP/in/dungeon.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - env:
          SLUG: ${{ needs.analyze.outputs.slug }}
        run: |
          [[ "$SLUG" =~ ^gh-[a-z0-9-]{1,57}$ ]] || exit 1
          cp "$RUNNER_TEMP/in/dungeon.json" "game/public/dungeons/$SLUG.json"
          node game/scripts/build-index.mjs
          git config user.name "headcrawl-bot"
          git config user.email "headcrawl-bot@users.noreply.github.com"
          git add game/public/dungeons
          git commit -m "chore: add $SLUG dungeon" || exit 0
          git push
      - env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.analyze.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME:-main}"
          gh issue comment "$ISSUE" --body "Dungeon is up in a few minutes: ${PAGES}#/play/${SLUG}"
          gh issue close "$ISSUE"
