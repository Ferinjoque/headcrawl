# Actions are pinned to commit SHAs; this keeps the pins moving.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /game
    schedule:
      interval: monthly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: uv
    directory: /analyzer
    schedule:
      interval: monthly
