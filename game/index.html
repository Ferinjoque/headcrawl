<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      This policy covers the page only. The analyzer worker (src/lite/worker.ts)
      gets no policy from a meta tag, and it needs api.github.com,
      raw.githubusercontent.com and 'wasm-unsafe-eval'. Keep that in mind if
      this ever moves to real response headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="A roguelike where the dungeon is a git repo. Functions are monsters, TODOs are loot, hotspots are bosses." />
    <meta name="theme-color" content="#1d1013" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>HEADCRAWL</title>
  </head>
  <body>
    <div id="app">
      <header id="hud" aria-live="off"></header>
      <main id="stage">
        <canvas id="view" aria-label="Dungeon map"></canvas>
        <div id="banner" aria-live="polite"></div>
        <div id="tip" role="tooltip" hidden></div>
        <div id="touch" hidden></div>
      </main>
      <aside id="panel" aria-label="Details"></aside>
      <section id="log" aria-live="polite" aria-label="Message log"></section>
      <div id="screen" hidden></div>
    </div>
    <input id="file" type="file" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
